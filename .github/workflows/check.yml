name: Website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/check-liquidity-animation.mjs
      - run: node scripts/check-service-navigation.mjs
      - run: node scripts/check-need-illustrations.mjs
      - run: node scripts/check-asset-explorer.mjs
      - run: node scripts/check-asset-models.mjs
      - run: npm run build
